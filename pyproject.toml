[project]
name = "pyanimecli"
version = "1.2.4"
description = "A powerful command-line interface for searching, getting info, and watching anime directly from your terminal."
authors = [{name="Gamma", email="Gamma.scratch@gmail.com"}]
license = {text = "MIT"}
readme = "README.md"
dependencies = ["requests", "rich", "pym3u8downloader", "packaging", "tqdm", "rich-pixels", "pillow"]

[project.urls]
Homepage = "https://github.com/princevegetadev/pyanimecli"
Source = "https://github.com/princevegetadev/pyanimecli"
Tracker = "https://github.com/princevegetadev/pyanimecli/issues"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project.scripts]
pyanimecli = "pyanimecli.pyanimecli:main"

[tool.setuptools.packages.find]
include = ["pyanimecli*"]
exclude = ["web*"]